<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playable Placeholder</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #34455f, #101820 65%); color: #edf3fb; overflow: hidden; }
    .stage { width: min(88vw, 760px); aspect-ratio: 16 / 9; border: 1px solid rgba(255,255,255,.16); border-radius: 24px; display: grid; place-items: center; position: relative; background: linear-gradient(135deg, rgba(111,182,255,.18), rgba(101,210,110,.12)); box-shadow: 0 24px 70px rgba(0,0,0,.4); }
    .orb { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: #65d26e; box-shadow: 0 0 35px rgba(101,210,110,.7); animation: drift 6s ease-in-out infinite alternate; }
    .orb:nth-child(2) { width: 34px; height: 34px; left: 16%; top: 22%; background: #6fb6ff; animation-delay: -2s; }
    .orb:nth-child(3) { right: 18%; bottom: 20%; background: #ff65c8; animation-delay: -4s; }
    .copy { text-align: center; padding: 24px; z-index: 1; }
    h1 { margin: 0 0 10px; font-size: clamp(1.8rem, 5vw, 3.4rem); }
    p { margin: 0; color: #aab6c5; }
    kbd { display: inline-block; margin: 16px 4px 0; padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.14); }
    @keyframes drift { from { transform: translate(-110px, -30px) scale(.9); } to { transform: translate(110px, 42px) scale(1.15); } }
  </style>
</head>
<body>
  <main class="stage" aria-label="Playable game placeholder">
    <div class="orb"></div><div class="orb"></div><div class="orb"></div>
    <div class="copy">
      <h1 id="game-title">Game Export Placeholder</h1>
      <p>ここに Godot Web エクスポートの index.html を配置します。</p>
      <kbd>WASD</kbd><kbd>Mouse</kbd><kbd>Space</kbd>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const title = params.get('title');
    if (title) document.querySelector('#game-title').textContent = title;
  </script>
</body>
</html>
